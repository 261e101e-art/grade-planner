[project]
name = "grade-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "261e101e-art", email = "261e101e@gsuite.kobe-u.ac.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.scripts]
grade-planner = "grade_planner:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
